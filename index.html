<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نذاكر | بوابة البحث عن نتيجة الثانوية العامة 2026</title>
    <link rel="icon" type="image/png" href="https://than.nezakr.net/nezakr2018/logo.png">
    <meta name="theme-color" content="#0d6efd">
    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(-45deg, #0a0e27, #1a1a3e, #0d1b2a, #1b2f4a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container-custom {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 35px 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .brand img {
            height: 55px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
        }
        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f9d976, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }
        .brand small {
            color: #aab;
            font-size: 0.9rem;
            display: block;
            margin-top: -5px;
            -webkit-text-fill-color: #aab;
        }

        .search-form .form-control, .search-form .form-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .search-form .form-control:focus, .search-form .form-select:focus {
            background: rgba(255, 255, 255, 0.14);
            border-color: #f1c40f;
            box-shadow: 0 0 0 4px rgba(241, 196, 15, 0.25);
            color: #fff;
        }
        .search-form .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .search-form .form-label {
            font-weight: 600;
            color: #ddd;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-form .form-label i {
            color: #f1c40f;
        }
        .btn-search {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #0a0e27;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(241, 196, 15, 0.3);
        }
        .btn-search:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(241, 196, 15, 0.5);
            background: linear-gradient(135deg, #f5d627, #e67e22);
            color: #000;
        }
        .btn-search:active { transform: scale(0.97); }

        /* result card */
        .result-card {
            display: none;
            margin-top: 35px;
            background: rgba(255,255,255,0.06);
            border-radius: 28px;
            padding: 25px 20px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            animation: fadeSlide 0.6s ease;
        }
        .result-card.show { display: block; }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .result-header .badge-pass {
            background: #2ecc71;
            color: #fff;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
        }
        .result-header .badge-fail {
            background: #e74c3c;
            color: #fff;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
        }
        .student-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }
        .student-meta {
            color: #bbb;
            font-size: 0.9rem;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(#f1c40f var(--score), rgba(255,255,255,0.08) var(--score));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px auto 20px;
            position: relative;
            box-shadow: 0 0 40px rgba(241, 196, 15, 0.2);
        }
        .score-circle .num {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }
        .score-circle .label {
            font-size: 0.75rem;
            color: #ccc;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
            gap: 12px;
            margin: 20px 0;
        }
        .subject-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .subject-item:hover { background: rgba(255,255,255,0.09); }
        .subject-item .s-name { font-size: 0.9rem; color: #ddd; }
        .subject-item .s-score { font-size: 1.1rem; font-weight: 700; color: #f1c40f; }
        .progress-thin { height: 4px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 6px; }
        .progress-thin .bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #f1c40f, #f39c12); width: 0%; }

        .footer-note {
            margin-top: 25px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 20px;
        }

        /* responsive */
        @media (max-width: 600px) {
            .container-custom { padding: 20px 15px; }
            .brand h1 { font-size: 1.5rem; }
            .student-name { font-size: 1.2rem; }
            .score-circle { width: 100px; height: 100px; }
            .score-circle .num { font-size: 2rem; }
            .subject-grid { grid-template-columns: 1fr 1fr; }
        }
        /* hide scrollbar but keep functionality */
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #f1c40f; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- خلفية متحركة (جسيمات) -->
    <div class="particles" id="particles"></div>

    <div class="container-custom">
        <!-- العلامة التجارية -->
        <div class="brand">
            <img src="https://than.nezakr.net/nezakr2018/logo.png" alt="نذاكر">
            <div>
                <h1>نذاكر <i class="fas fa-graduation-cap" style="-webkit-text-fill-color: #f1c40f; font-size: 1.8rem;"></i></h1>
                <small>بوابة البحث عن نتيجة الثانوية العامة 2026</small>
            </div>
        </div>

        <!-- نموذج البحث -->
        <form id="searchForm" class="search-form">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label"><i class="fas fa-user"></i> الاسم رباعي</label>
                    <input type="text" class="form-control" id="studentName" placeholder="مثال: احمد محمد علي حسن" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label"><i class="fas fa-hashtag"></i> رقم الجلوس (7 أرقام)</label>
                    <input type="text" class="form-control" id="seatNumber" placeholder="مثال: 2044566" maxlength="7" pattern="\d{7}" inputmode="numeric" required>
                </div>
                <div class="col-12">
                    <label class="form-label"><i class="fas fa-layer-group"></i> الشعبة</label>
                    <select class="form-select" id="major">
                        <option value="علوم">علوم</option>
                        <option value="رياضه">رياضه</option>
                        <option value="ادبي">ادبي</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn-search"><i class="fas fa-search"></i> بحث عن النتيجة</button>
                </div>
            </div>
        </form>

        <!-- بطاقة النتيجة -->
        <div id="resultCard" class="result-card">
            <div class="result-header">
                <div>
                    <div class="student-name" id="displayName">—</div>
                    <div class="student-meta" id="displayMeta">رقم الجلوس: — | الشعبة: —</div>
                </div>
                <div id="statusBadge"><span class="badge-pass">ناجح ✅</span></div>
            </div>

            <div class="score-circle" id="scoreCircle" style="--score:0%">
                <span class="num" id="totalPercent">0%</span>
                <span class="label">النسبة المئوية</span>
            </div>

            <div style="text-align:center; margin-bottom:10px;">
                <span style="font-size:1.1rem; color:#ddd;">المجموع: <strong id="totalScore">0</strong> / <span id="totalMax">320</span></span>
                <span style="display:inline-block; margin-right:15px; background:rgba(255,255,255,0.05); padding:2px 12px; border-radius:40px; font-size:0.9rem; color:#aaa;" id="gradeText">ممتاز</span>
            </div>

            <div class="subject-grid" id="subjectsContainer"></div>

            <div style="text-align:center; margin-top:10px;">
                <button class="btn btn-outline-warning btn-sm" onclick="window.location.reload();" style="border-radius:40px; padding:6px 24px;"><i class="fas fa-rotate-left"></i> بحث جديد</button>
            </div>
        </div>

        <div class="footer-note">
            <i class="fas fa-database"></i> يتم حفظ النتائج تلقائياً — البحث مرة أخرى يعرض نفس النتيجة
        </div>
    </div>

    <script>
        (function() {
            // ======= توليد الجسيمات للخلفية =======
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = 3 + Math.random() * 8;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (10 + Math.random() * 25) + 's';
                p.style.animationDelay = (Math.random() * 20) + 's';
                p.style.opacity = 0.1 + Math.random() * 0.3;
                particlesContainer.appendChild(p);
            }

            // ======= قائمة المواد الثابتة (لشعبة علوم) =======
            const SUBJECTS = [
                { name: 'اللغة العربية', max: 80 },
                { name: 'اللغة الأجنبية الأولى', max: 60 },
                { name: 'مجموع الرياضيات البحتة', max: 60 },
                { name: 'الكيمياء', max: 60 },
                { name: 'الفيزياء', max: 60 },
                { name: 'التربية الدينية', max: 25 },
                { name: 'التربية الوطنية', max: 25 },
                { name: 'اللغة الأجنبية الثانية', max: 25 }
            ];
            const TOTAL_MAX = SUBJECTS.reduce((sum, s) => sum + s.max, 0);

            // ======= بيانات التخزين المحلي =======
            const STORAGE_KEY = 'nzakr_results_v1';

            function loadAllResults() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch { return {}; }
            }

            function saveResult(seat, data) {
                const all = loadAllResults();
                all[seat] = data;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
            }

            function getResult(seat) {
                const all = loadAllResults();
                return all[seat] || null;
            }

            // ======= توليد نتيجة عشوائية (مع الكسور) =======
            function generateRandomResult(name, seat, major) {
                // توليد نسبة مئوية بين 40 و 93 مع كسر
                const percent = 40 + Math.random() * 53; // 40.00 -> 93.00
                const roundedPercent = Math.round(percent * 100) / 100; // خانتين عشريتين

                // المجموع الكلي
                const total = Math.round((roundedPercent / 100) * TOTAL_MAX * 100) / 100;

                // توليد درجات كل مادة (مع تناسب مع النسبة العامة مع بعض التوزيع العشوائي)
                const subjects = SUBJECTS.map(sub => {
                    // انحراف عشوائي ± 10% من النسبة العامة
                    const variation = (Math.random() * 20) - 10; // -10 .. +10
                    let rawPercent = roundedPercent + variation;
                    rawPercent = Math.min(95, Math.max(30, rawPercent)); // حدود آمنة
                    const score = Math.round((rawPercent / 100) * sub.max * 100) / 100;
                    return {
                        name: sub.name,
                        max: sub.max,
                        score: Math.min(sub.max, Math.max(0, score))
                    };
                });

                // إعادة حساب المجموع الفعلي من الدرجات لضمان الدقة
                const actualTotal = subjects.reduce((sum, s) => sum + s.score, 0);
                const actualPercent = Math.round((actualTotal / TOTAL_MAX) * 100 * 100) / 100;

                // تقدير
                let grade = 'ممتاز';
                if (actualPercent < 50) grade = 'ضعيف';
                else if (actualPercent < 65) grade = 'مقبول';
                else if (actualPercent < 75) grade = 'جيد';
                else if (actualPercent < 85) grade = 'جيد جداً';
                else grade = 'ممتاز';

                return {
                    name: name.trim(),
                    seat: seat,
                    major: major,
                    total: Math.round(actualTotal * 100) / 100,
                    max: TOTAL_MAX,
                    percent: actualPercent,
                    grade: grade,
                    subjects: subjects,
                    status: actualPercent >= 50 ? 'pass' : 'fail',
                    timestamp: Date.now()
                };
            }

            // ======= عرض النتيجة =======
            function displayResult(data) {
                const card = document.getElementById('resultCard');
                card.classList.add('show');

                document.getElementById('displayName').textContent = data.name;
                document.getElementById('displayMeta').textContent = `رقم الجلوس: ${data.seat} | الشعبة: ${data.major}`;

                // الحالة
                const badge = document.getElementById('statusBadge');
                if (data.status === 'pass') {
                    badge.innerHTML = `<span class="badge-pass">ناجح ✅</span>`;
                } else {
                    badge.innerHTML = `<span class="badge-fail">راسب ❌</span>`;
                }

                // الدائرة
                const circle = document.getElementById('scoreCircle');
                const percentNum = data.percent;
                circle.style.setProperty('--score', percentNum + '%');
                document.getElementById('totalPercent').textContent = percentNum.toFixed(2) + '%';

                // المجموع
                document.getElementById('totalScore').textContent = data.total.toFixed(2);
                document.getElementById('totalMax').textContent = data.max;

                // التقدير
                document.getElementById('gradeText').textContent = data.grade;

                // المواد
                const container = document.getElementById('subjectsContainer');
                container.innerHTML = '';
                data.subjects.forEach(sub => {
                    const pct = Math.round((sub.score / sub.max) * 100 * 10) / 10;
                    const div = document.createElement('div');
                    div.className = 'subject-item';
                    div.innerHTML = `
                        <div class="s-name">${sub.name}</div>
                        <div class="s-score">${sub.score.toFixed(1)} <small style="color:#888;font-size:0.7rem;">/ ${sub.max}</small></div>
                        <div class="progress-thin"><div class="bar" style="width:${Math.min(100, pct)}%;"></div></div>
                    `;
                    container.appendChild(div);
                });
            }

            // ======= معالجة البحث =======
            const form = document.getElementById('searchForm');
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const nameInput = document.getElementById('studentName');
                const seatInput = document.getElementById('seatNumber');
                const majorSelect = document.getElementById('major');

                const name = nameInput.value.trim();
                const seat = seatInput.value.trim();
                const major = majorSelect.value;

                // التحقق من صحة رقم الجلوس (7 أرقام)
                if (!/^\d{7}$/.test(seat)) {
                    alert('رقم الجلوس يجب أن يكون 7 أرقام فقط.');
                    seatInput.focus();
                    return;
                }
                if (name.length < 4) {
                    alert('الرجاء إدخال الاسم رباعي (على الأقل 4 أحرف).');
                    nameInput.focus();
                    return;
                }

                // البحث في التخزين المحلي
                let existing = getResult(seat);
                if (existing) {
                    // تأكد من تطابق الاسم والشعبة (اختياري)
                    // نعرض النتيجة المخزنة
                    displayResult(existing);
                    return;
                }

                // إنشاء نتيجة جديدة
                const newResult = generateRandomResult(name, seat, major);
                saveResult(seat, newResult);
                displayResult(newResult);
            });

            // ======= إدخال تلقائي للمثال (للتجربة) =======
            // يمكن تفعيله عند تحميل الصفحة لملء نموذج مثال
            // غير مفعل لعدم التداخل مع تجربة المستخدم
        })();
    </script>

    <!-- Bootstrap JS (اختياري للتفاعل) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
